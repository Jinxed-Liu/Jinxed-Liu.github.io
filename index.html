<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="eSheep+ 官方支持网站">
  <title>eSheep+ 支持</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f6f1;
      color: #172019;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #ffffff 0, #eef4eb 58%, #e4ece0 100%);
    }
    main {
      width: min(680px, 100%);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(46, 88, 55, .14);
      border-radius: 28px;
      background: rgba(255, 255, 255, .84);
      box-shadow: 0 24px 70px rgba(31, 61, 38, .12);
    }
    .mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      margin-bottom: 28px;
      background: #246b3b;
      color: white;
      font-size: 28px;
    }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 7vw, 54px); letter-spacing: -.04em; }
    p { margin: 0; color: #526058; font-size: 17px; line-height: 1.75; }
    .support { margin-top: 34px; padding-top: 28px; border-top: 1px solid #dce5d9; }
    a { color: #176332; font-weight: 650; text-underline-offset: 4px; }
    small { display: block; margin-top: 28px; color: #748078; line-height: 1.6; }
    @media (prefers-color-scheme: dark) {
      :root { background: #101512; color: #f0f5f1; }
      body { background: radial-gradient(circle at top, #243128 0, #121814 66%); }
      main { background: rgba(25, 33, 28, .9); border-color: rgba(181, 217, 188, .14); }
      p { color: #bdc9c0; }
      .support { border-color: #35423a; }
      a { color: #8fd5a2; }
      small { color: #8d9a91; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">羊</div>
    <h1>eSheep+ 支持</h1>
    <p>面向羊场日常生产记录与管理的 iPhone 应用。隐私政策与服务条款正在完成正式发布前的最终核验。</p>
    <section class="support" aria-labelledby="support-title">
      <h2 id="support-title">联系我们</h2>
      <p>产品支持与隐私咨询：<a href="mailto:1196705821@qq.com">1196705821@qq.com</a></p>
    </section>
    <small>eSheep+ Support · 中国大陆</small>
  </main>
</body>
</html>
